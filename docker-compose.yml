services:
  web:
    build: .
    image: finanzas-personales:local
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Overrides the relative DATABASE_URL from .env so it resolves to the
      # mounted file inside the container (env > env_file in compose).
      DATABASE_URL: "file:/app/prisma/dev.db"
      NODE_ENV: production
    volumes:
      # Named volume on the whole prisma dir. On first run Docker seeds it
      # from the image (schema.prisma + migrations), then the SQLite db
      # persists across restarts. Avoids the single-file bind-mount pitfall
      # where a missing host path becomes a directory and breaks SQLite.
      - finanzas-db:/app/prisma
    # Apply migrations before starting (schema.prisma + migrations stay in
    # the image; only the .db file is mounted).
    command: sh -c "npx prisma migrate deploy && npm run start"
    restart: unless-stopped

volumes:
  finanzas-db:
